  <!--CD:HEAD--><!--/CD:HEAD-->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0C0C0C; --ink: #0C0C0C; --dark: #1A1A1A; --darkgrey: #2E2E2E;
      --muted: #666666; --silver: #AAAAAA; --border: #D0CEC7;
      --cream: #E8E6DF; --offwhite: #F4F3EF; --white: #FFFFFF; --green: #1B5E20;
    }
    html, body { background: var(--offwhite); color: var(--ink); font-family: 'Lora', Georgia, serif; line-height: 1.7; font-size: 16px; }
    header { background: var(--black); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--darkgrey); }
    .logo { font-family: 'Anton', Impact, sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--white); text-decoration: none; }
    .logo span { color: #66BB6A; }
    .back-link { font-family: 'Lora', Georgia, serif; font-size: 13px; font-weight: 600; color: var(--silver); text-decoration: none; }
    .back-link:hover { color: var(--white); }
    main { max-width: 740px; margin: 0 auto; padding: 56px 24px 96px; }
    .page-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .page-eyebrow::before { content: ''; display: block; width: 16px; height: 1px; background: var(--green); flex-shrink: 0; }
    .page-eyebrow span { font-family: 'Lora', Georgia, serif; font-size: 10px; font-weight: 700; font-style: italic; letter-spacing: 1px; text-transform: uppercase; color: var(--green); }
    h1 { font-family: 'Anton', Impact, sans-serif; font-size: 36px; letter-spacing: 1px; line-height: 1.1; color: var(--ink); margin-bottom: 12px; text-transform: uppercase; }
    @media (max-width: 480px) { h1 { font-size: 28px; } }
    .byline { font-family: 'Lora', Georgia, serif; font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 28px; }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
    p { font-size: 15px; color: var(--muted); margin-bottom: 18px; }
    p strong { color: var(--ink); font-weight: 600; }
    h2 { font-family: 'Anton', Impact, sans-serif; font-size: 19px; letter-spacing: 1.5px; color: var(--ink); margin: 40px 0 14px; }
    h3 { font-family: 'Lora', Georgia, serif; font-size: 16px; font-weight: 700; color: var(--ink); margin: 30px 0 6px; }
    a { color: var(--green); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .cta-box { background: var(--cream); border-left: 3px solid var(--green); padding: 20px 24px; margin: 40px 0; }
    .cta-box p { margin-bottom: 0; font-size: 14px; }
    .cta-actions { display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0 0; }
    .cta-actions a { display: inline-block; font-size: 13.5px; font-weight: 700; padding: 10px 20px; border-radius: 4px; }
    .cta-actions .cta-primary { background: var(--green); color: var(--white); }
    .cta-actions .cta-primary:hover { background: #164a18; text-decoration: none; }
    .cta-actions .cta-secondary { border: 1px solid var(--border); color: var(--ink); }
    .cta-actions .cta-secondary:hover { border-color: var(--green); text-decoration: none; }
    .related { margin-top: 56px; }
    .related h3 { font-family: 'Anton', Impact, sans-serif; font-size: 14px; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 14px; font-weight: 400; }
    .related a { display: block; font-size: 14px; margin-bottom: 8px; }
    figure.board { margin: 22px 0 14px; text-align: center; }
    figure.board svg { display: block; margin: 0 auto; max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 3px; background: var(--white); }
    figure.board figcaption { font-size: 13px; font-style: italic; color: var(--muted); margin-top: 10px; line-height: 1.5; max-width: 460px; margin-left: auto; margin-right: auto; }
    .player-note { background: var(--white); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: 4px; padding: 14px 20px 2px; margin: 0 0 24px; }
    .player-note-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--green); margin-bottom: 4px; }
    .player-note p { color: var(--ink); font-size: 14.5px; margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; margin: 22px 0; }
    table.simple { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--white); border: 1px solid var(--border); }
    table.simple th { text-align: left; font-family: 'Lora', Georgia, serif; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--green); padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--offwhite); }
    table.simple td { padding: 9px 12px; border-bottom: 1px solid var(--cream); color: var(--muted); vertical-align: top; }
    .credit { font-size: 11.5px; color: var(--muted); margin-top: 36px; }
    footer { text-align: center; padding: 32px 24px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    .game-meta { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .game-meta strong { color: var(--ink); }
    .graph-card { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 14px 14px 8px; margin: 22px 0; }
    .graph-card svg { display: block; width: 100%; height: auto; }
    .graph-legend { font-size: 12px; color: var(--muted); font-style: italic; padding: 6px 4px 4px; }
    .movelist-wrap { overflow-x: auto; margin: 22px 0; }
    table.movelist { border-collapse: collapse; background: var(--white); border: 1px solid var(--border); min-width: 320px; }
    table.movelist th { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--green); padding: 8px 16px; text-align: left; background: var(--offwhite); border-bottom: 1px solid var(--border); }
    table.movelist td { padding: 6px 16px; font-size: 14px; color: var(--ink); border-bottom: 1px solid var(--cream); font-family: 'Courier New', monospace; }
    table.movelist td.num-col { color: var(--muted); }
    .mq { font-family: 'Lora', Georgia, serif; font-weight: 700; font-size: 12px; margin-left: 3px; padding: 0 4px; border-radius: 3px; }
    .qb { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; vertical-align: middle; }
    .q-inaccuracy { background: #FFF3C4; color: #6B5300; }
    .q-mistake { background: #FFD9B3; color: #7A3B00; }
    .q-blunder { background: #F8C9C4; color: #8A1C12; }
    .q-checkmate { background: #CFE8D1; color: #1B5E20; }
    .game-card { border-bottom: 1px solid var(--border); padding: 4px 0 10px; margin-bottom: 18px; }
    .game-card h3 { margin-top: 0; }
    .game-card .game-meta { margin-bottom: 8px; }
    .loading { font-style: italic; }
  </style>
</head>

  <!--CD:LOADER-->
  <script src="/g/pieces.js"></script>
  <script src="/g/report-render.js"></script>
  <script>
    (function () {
      var main = document.getElementById('report');
      var SLUG = /^[a-z0-9-]{8,80}$/;
      var m = /^\/g\/([^/]+)\/?$/.exec(location.pathname);
      var slug = m ? m[1] : new URLSearchParams(location.search).get('id');

      function notFound() {
        document.title = 'Game report not found — ChessDiary';
        main.innerHTML = '<div class="page-eyebrow"><span>Player-Annotated Game</span></div>' +
          '<h1>Report not found</h1>' +
          '<p>This game report has been unpublished, or the link is incomplete.</p>' +
          '<p><a href="/games/">See the player-annotated games →</a></p>';
      }

      if (!slug || !SLUG.test(slug)) return notFound();
      fetch('https://firestore.googleapis.com/v1/projects/chessdiary-7f1e3/databases/(default)/documents/publicGames/' +
            slug + '?key=AIzaSyB_mxJS3rdPPKu9ujQf8kc1eEfw_4F2Nvo')
        .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
        .then(function (doc) {
          var page = CDReport.render(CDReport.fromFirestoreRest(doc));
          main.innerHTML = page.html;
          document.title = page.title + ' — ChessDiary';
          document.querySelector('meta[name="description"]').setAttribute('content', page.description);
        })
        .catch(notFound);
    })();
  </script>
  <!--/CD:LOADER-->

</body>
