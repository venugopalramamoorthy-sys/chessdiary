<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ChessDiary — your chess game library.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!--
    This is the Flutter app shell — no server-rendered content, just this
    empty body plus meta tags. Kept out of the sitemap and marked noindex so
    it isn't judged as a thin/low-value content page by crawlers.
  -->
  <meta name="robots" content="noindex">
  <style>
    /* Prevent Safari's elastic overscroll from conflicting with Flutter's scroll handling */
    html, body {
      overscroll-behavior: none;
      overflow: hidden;
      height: 100%;
      touch-action: pan-x pan-y;
    }
    /* Prevent Safari tap highlight on Flutter canvas */
    * { -webkit-tap-highlight-color: transparent; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="chessdiary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>chessdiary</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T6JH6LZ7VD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-T6JH6LZ7VD');
  </script>

  <!--
    Google AdSense is intentionally NOT loaded on this page. This is the
    Flutter app shell (sign-in / sign-up screen) — Google flagged it under
    "ads on screens without publisher content." AdSense now only loads on
    the static /guides pages, which have substantial real content. See
    web/guides/*/index.html.
  -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
